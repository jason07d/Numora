<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Numora – Ultimate Edition</title>
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">

    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://w3.org' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='24' fill='%23f8fafc' stroke='%2338bdf8' stroke-width='6'/%3E%3Crect x='18' y='34' width='64' height='32' rx='12' fill='%230f172a' stroke='%2338bdf8' stroke-width='4'/%3E%3Ccircle cx='36' cy='50' r='6' fill='%2338bdf8'/%3E%3Ccircle cx='64' cy='50' r='6' fill='%2338bdf8'/%3E%3Crect x='54' y='6' width='40' height='22' rx='8' fill='%233b82f6'/%3E%3Ctext x='74' y='21' text-anchor='middle' fill='white' font-size='13' font-weight='bold'%3E42%3F%3C/text%3E%3C/svg%3E">
    <style>
        :root {
            --primary: #3b82f6; --primary-hover: #2563eb;
            --bg-card: rgba(15, 23, 42, 0.78);
            --text-main: #f8fafc; --text-muted: #94a3b8;
            --border-color: rgba(255, 255, 255, 0.18);
            --font-family: 'Segoe UI', system-ui, sans-serif;
        }
        * { box-sizing: border-box; font-family: var(--font-family); -webkit-tap-highlight-color: transparent; }
        html, body {
            margin: 0; padding: 0; width: 100%; min-height: 100dvh;
            background: #050811; color: var(--text-main);
            display: flex; justify-content: center; align-items: center;
            overflow-x: hidden;
        }
        #matrix-canvas { position: fixed; inset: 0; width: 100%; height: 100%; z-index: 0; pointer-events: none; }

        /* Laptop & Standard-Ansicht */
        .container {
            position: relative; z-index: 1;
            width: calc(100% - 28px); max-width: 560px; margin: 14px auto;
            background: var(--bg-card); backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px);
            border: 1px solid var(--border-color); border-radius: 22px;
            padding: 20px; box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.75);
        }

        /* iPad / Tablet (Hoch- und Querformat) */
        @media (min-width: 600px) and (max-width: 1024px) {
            .container { max-width: 620px; width: 88%; padding: 24px; margin: 22px auto; }
        }

        /* Smartphone Hochkant */
        @media (max-width: 599px) {
            body { align-items: flex-start; padding: 8px 0; }
            .container {
                width: calc(100% - 16px); margin: 8px auto;
                padding: 14px 12px; border-radius: 18px;
                background: rgba(15, 23, 42, 0.75);
            }
            h1 { font-size: 1.45rem !important; }
            .app-logo-box { width: 64px !important; height: 64px !important; }
            .nav-tabs button { font-size: 0.76rem !important; padding: 8px 2px !important; }
            .scroll-area { max-height: 52dvh !important; }
        }

        @keyframes astroBlink {
            0%, 46%, 50%, 96%, 100% { transform: scaleY(1) translateX(0); }
            48% { transform: scaleY(0.1) translateX(0); }
            20%, 30% { transform: scaleY(1) translateX(-2px); }
            70%, 80% { transform: scaleY(1) translateX(2px); }
        }
        .astro-eye { width: 8px; height: 8px; border-radius: 50%; animation: astroBlink 4.5s infinite ease-in-out; }

        .top-profile { display: flex; justify-content: space-between; align-items: center; background: rgba(30, 41, 59, 0.68); padding: 10px 14px; border-radius: 12px; border: 1px solid var(--border-color); margin-bottom: 12px; font-size: 0.85rem; }
        .xp-bar-wrap { width: 100%; height: 8px; background: rgba(255,255,255,0.12); border-radius: 6px; overflow: hidden; margin-top: 6px; }
        .xp-bar-fill { height: 100%; width: 0%; background: linear-gradient(90deg, #3b82f6, #a855f7); transition: width 0.3s ease; }
        .nav-tabs { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; margin-bottom: 12px; }
        .nav-tabs button { margin: 0; padding: 8px 4px; font-size: 0.82rem; background: rgba(30, 41, 59, 0.75); border: 1px solid var(--border-color); }
        .nav-tabs button.active { background: var(--primary); border-color: #60a5fa; }
        .app-header { display: flex; flex-direction: column; align-items: center; margin-bottom: 10px; position: relative; }
        .icon-wrapper { position: relative; margin-top: 16px; }
        .app-hat { position: absolute; top: -24px; left: 50%; transform: translateX(-50%); font-size: 1.9rem; z-index: 4; filter: drop-shadow(0 2px 4px rgba(0,0,0,0.7)); pointer-events: none; }
        .app-rosette { position: absolute; bottom: -6px; right: -10px; font-size: 1.35rem; z-index: 4; pointer-events: none; }
        .app-logo-box { width: 72px; height: 72px; border-radius: 18px; display: flex; justify-content: center; align-items: center; box-shadow: 0 8px 20px rgba(0,0,0,0.5), inset 0 2px 4px rgba(255,255,255,0.3); font-size: 1.45rem; font-weight: 900; color: white; position: relative; }
        h1 { margin: 6px 0 0 0; font-size: 1.7rem; letter-spacing: 2px; background: linear-gradient(90deg, #60a5fa, #c084fc); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
        .form-group { margin-bottom: 10px; }
        label { display: block; font-size: 0.82rem; color: var(--text-muted); margin-bottom: 4px; font-weight: 600; }
        select, input[type="number"], input[type="password"], input[type="text"], textarea { width: 100%; padding: 10px 12px; border-radius: 10px; border: 1px solid var(--border-color); background: rgba(30, 41, 59, 0.82); color: inherit; font-size: 1rem; outline: none; }
        .row { display: flex; gap: 10px; } .row > div { flex: 1; }
        .checkbox-group { display: flex; align-items: center; gap: 10px; background: rgba(30, 41, 59, 0.48); padding: 8px 12px; border-radius: 10px; border: 1px solid var(--border-color); margin-bottom: 8px; cursor: pointer; font-size: 0.88rem; }
        button { width: 100%; padding: 11px; border: none; border-radius: 10px; background: var(--primary); color: white; font-size: 0.95rem; font-weight: 600; cursor: pointer; transition: 0.15s; margin-top: 6px; }
        button:hover { background: var(--primary-hover); }
        button.secondary { background: rgba(51, 65, 85, 0.78); border: 1px solid var(--border-color); }
        button.danger-btn { background: linear-gradient(90deg, #dc2626, #ea580c); font-weight: 700; }
        button.gold-btn { background: linear-gradient(90deg, #d97706, #f59e0b); color: #0f172a; font-weight: 800; }
        button:disabled { opacity: 0.45; cursor: not-allowed; }
        .hidden { display: none !important; }
        .scroll-area { max-height: 360px; overflow-y: auto; padding-right: 4px; }
        .shop-card { display: flex; justify-content: space-between; align-items: center; background: rgba(30, 41, 59, 0.65); border: 1px solid var(--border-color); padding: 10px 12px; border-radius: 10px; margin-bottom: 8px; gap: 10px; }
        .shop-card h4 { margin: 0 0 3px 0; font-size: 0.9rem; } .shop-card p { margin: 0; font-size: 0.77rem; color: var(--text-muted); }
        .shop-card button { width: auto; min-width: 105px; margin: 0; padding: 8px 10px; font-size: 0.8rem; }
        .stats-bar { display: flex; justify-content: space-between; background: rgba(30, 41, 59, 0.78); padding: 9px 12px; border-radius: 10px; margin-bottom: 10px; font-size: 0.86rem; border: 1px solid var(--border-color); }
        .temp-badge { text-align: center; padding: 8px; border-radius: 10px; font-weight: bold; margin: 8px 0; border: 1px solid var(--border-color); }
        .action-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 6px; margin-top: 8px; }
        .action-grid button { margin: 0; padding: 8px; font-size: 0.79rem; }
        .hint-log { margin-top: 8px; font-size: 0.84rem; color: #fde047; background: rgba(250, 204, 21, 0.1); border-radius: 8px; padding: 8px; }
        .history-log { margin-top: 10px; max-height: 105px; overflow-y: auto; font-size: 0.82rem; background: rgba(15, 23, 42, 0.58); border-radius: 8px; padding: 6px 10px; }
        .history-item { display: flex; justify-content: space-between; padding: 3px 0; border-bottom: 1px solid rgba(255,255,255,0.06); }
    </style>
</head>
<body>
<canvas id="matrix-canvas"></canvas>

<div class="container">
    <div class="top-profile">
        <div style="flex: 1; padding-right: 12px;">
            <div><strong id="ui-level">Lvl 1</strong> <span id="ui-prestige" style="color:#c084fc; font-weight:bold; margin-left:6px;">Prestige 0</span></div>
            <div class="xp-bar-wrap"><div class="xp-bar-fill" id="ui-xp-bar"></div></div>
            <div style="font-size:0.74rem; color:var(--text-muted); margin-top:2px;" id="ui-xp-text">0 / 500 EP</div>
        </div>
        <div style="text-align: right;">
            <div style="color:#fbbf24; font-weight:800; font-size:1rem;">🪙 <span id="ui-coins">0</span></div>
            <div style="font-size:0.73rem; color:#34d399;">❤️ <span id="ui-inv-tries">0</span> | ⏱️ <span id="ui-inv-time">0</span></div>
        </div>
    </div>

    <div class="nav-tabs" id="main-nav">
        <button class="active" onclick="switchTab('play')" id="tab-play">🎮 Spielen</button>
        <button onclick="switchTab('shop')" id="tab-shop">🛒 Shop</button>
        <button onclick="switchTab('achievements')" id="tab-achievements">🏆 Erfolge</button>
        <button onclick="switchTab('settings')" id="tab-settings">⚙️ Optionen</button>
    </div>

    <div class="app-header">
        <div class="icon-wrapper">
            <div class="app-hat" id="ui-app-hat"></div>
            <div class="app-logo-box" id="ui-app-icon">42?</div>
            <div class="app-rosette" id="ui-app-rosette"></div>
        </div>
        <h1>NUMORA</h1>
    </div>

    <div id="view-play">
        <div id="setup-screen">
            <div class="form-group"><label id="lbl-mode">Spielmodus</label><select id="game-mode" onchange="toggleSetupOptions()"></select></div>
            <div class="row form-group">
                <div><label id="lbl-min">Untergrenze</label><input type="number" id="lower-bound" value="1"></div>
                <div><label id="lbl-max">Obergrenze</label><input type="number" id="upper-bound" value="100"></div>
            </div>
            <div class="form-group" id="bot-difficulty-group"><label id="lbl-bot">Bot-Schwierigkeit</label><select id="bot-difficulty"></select></div>
            <div class="form-group hidden" id="time-limit-group"><label id="lbl-timelimit">Zeitlimit (Sekunden)</label><input type="number" id="time-limit" value="45" min="10" max="600"></div>
            <label class="checkbox-group" id="hot-cold-row"><input type="checkbox" id="hot-cold-toggle" checked><span id="txt-hotcold"></span></label>
            <label class="checkbox-group" id="hints-row"><input type="checkbox" id="hints-toggle" checked><span id="txt-hints"></span></label>
            <button onclick="prepareGame()" id="btn-start">Spiel starten</button>
        </div>

        <div id="secret-setup-screen" class="hidden">
            <p id="secret-prompt-text" style="text-align:center;"></p>
            <div class="form-group"><input type="password" id="secret-number-input" placeholder="..."></div>
            <button onclick="confirmSecretNumber()" id="btn-confirm-secret">Bestätigen</button>
            <button class="secondary" onclick="resetToMenu()" id="btn-back-secret">Zurück</button>
        </div>

        <div id="game-screen" class="hidden">
            <div class="stats-bar"><span id="stat-range">1 – 100</span><span id="stat-attempts">Versuche: 0</span><span id="stat-special" class="hidden">❤️ 7</span></div>
            <div id="feedback-box" style="text-align:center; font-weight:700; margin-bottom:8px;"></div>
            <div id="temp-indicator" class="temp-badge hidden"></div>
            <div class="row">
                <div style="flex:2;"><input type="number" id="guess-input" placeholder="..." onkeypress="if(event.key==='Enter') makeGuess()"></div>
                <div style="flex:1;"><button style="margin-top:0;" onclick="makeGuess()" id="btn-guess">Raten</button></div>
            </div>
            <div id="consumables-bar" class="action-grid hidden" style="margin-top:8px;">
                <button class="gold-btn hidden" id="btn-use-tries" onclick="useExtraTries()"></button>
                <button class="gold-btn hidden" id="btn-use-time" onclick="useExtraTime()"></button>
            </div>
            <div id="sabotage-section" class="hidden" style="margin-top:10px; border-top:1px solid var(--border-color); padding-top:8px;">
                <label style="color:#f87171; text-align:center;" id="lbl-sabotage-title"></label>
                <div class="action-grid">
                    <button class="danger-btn" id="btn-sab-reset" onclick="triggerSabotage('reset')"></button>
                    <button class="danger-btn" id="btn-sab-scramble" onclick="triggerSabotage('scramble')"></button>
                    <button class="danger-btn" id="btn-sab-freeze" onclick="triggerSabotage('freeze')" style="grid-column: span 2;"></button>
                </div>
            </div>
            <div id="hints-section" style="margin-top:10px; border-top:1px solid var(--border-color); padding-top:8px;">
                <div class="action-grid">
                    <button class="secondary" id="btn-hint-parity" onclick="useHint('parity')"></button>
                    <button class="secondary" id="btn-hint-prime" onclick="useHint('prime')"></button>
                    <button class="secondary" id="btn-hint-digitsum" onclick="useHint('digitsum')"></button>
                    <button class="secondary" id="btn-hint-div3" onclick="useHint('div3')"></button>
                </div>
                <div id="hint-log" class="hint-log hidden"></div>
            </div>
            <div id="bot-status" class="hidden" style="margin-top:10px; padding:8px; background:rgba(59,130,246,0.18); border-radius:8px; font-size:0.86rem; text-align:center;"></div>
            <div class="history-log" id="history-log"></div>
        </div>

        <div id="result-screen" class="hidden" style="text-align:center;">
            <h2 id="result-title" style="margin:0 0 8px 0;"></h2>
            <p id="result-details" style="line-height:1.5; font-size:0.92rem; white-space:pre-line;"></p>
            <button onclick="resetToMenu()" id="btn-continue">Weiter</button>
        </div>
    </div>

    <div id="view-shop" class="hidden">
        <div class="shop-card" style="border-color:#c084fc; background:rgba(88,28,135,0.35);">
            <div><h4 style="color:#e879f9;" id="shop-prestige-title"></h4><p id="prestige-req-text"></p></div>
            <button class="gold-btn" id="btn-prestige" onclick="doPrestige()">Prestige!</button>
        </div>
        <div class="scroll-area" id="shop-items-container"></div>
    </div>

    <div id="view-achievements" class="hidden"><div class="scroll-area" id="achievements-container"></div></div>

    <div id="view-settings" class="hidden">
        <div class="scroll-area">
            <label class="checkbox-group"><input type="checkbox" id="opt-music" checked onchange="saveSettings()"><span id="txt-opt-music"></span></label>
            <label class="checkbox-group"><input type="checkbox" id="opt-sfx" checked onchange="saveSettings()"><span id="txt-opt-sfx"></span></label>
            <div class="form-group"><label>🌐 Sprache / Language</label><select id="opt-lang" onchange="changeLanguage()"><option value="de">Deutsch</option><option value="en">English</option></select></div>
            <div class="form-group">
                <label id="lbl-icon-num">🔢 Zahl auf dem Icon ändern</label>
                <input type="text" id="opt-icon-num" maxlength="4" placeholder="42?" oninput="changeIconNumberFromSettings()">
            </div>
            <div class="form-group">
                <label id="lbl-cosmetics"></label>
                <div class="row"><div><select id="opt-hat" onchange="applyCosmetics()"></select></div><div><select id="opt-font" onchange="applyCosmetics()"></select></div></div>
            </div>
            <hr style="border-color:var(--border-color); margin:12px 0;">
            <h4 style="margin:0 0 4px 0;" id="lbl-cloud-title"></h4>
            <p style="font-size:0.78rem; color:var(--text-muted); margin:0 0 8px 0;"><span id="txt-acc-desc"></span> <strong id="ui-account-id" style="color:#60a5fa;"></strong></p>
            <textarea id="save-code-box" rows="2"></textarea>
            <div class="row"><div><button class="secondary" onclick="exportSaveCode()" id="btn-export"></button></div><div><button onclick="importSaveCode()" id="btn-import"></button></div></div>
        </div>
    </div>
</div>
<script>
    const I18N = {
        de: {
            tabPlay: "🎮 Spielen", tabShop: "🛒 Shop", tabAch: "🏆 Erfolge", tabOpt: "⚙️ Optionen",
            lblMode: "Spielmodus", lblMin: "Untergrenze", lblMax: "Obergrenze", lblBot: "Bot-Schwierigkeit",
            lblTimeLimit: "Zeitlimit (Sek.)", txtHotCold: "🌡️ \"Heiß & Kalt\" aktivieren", txtHints: "💡 Kostenlose Tipps erlauben",
            btnStart: "Spiel starten", btnConfirm: "Bestätigen", btnBack: "Zurück", btnGuess: "Raten", btnContinue: "Weiter",

            itemTimeTitle: "⏱️ +15s Zeitbonus", itemTimeDesc: (n) => `+15 Sek. im Zeitmodus (Besitz: ${n})`,
            upGoldTitle: (cur) => `💰 Gold-Ausbeute (${cur}/500 🪙)`, upXpTitle: (cur) => `⚡ EP-Ausbeute (${cur}/500 EP)`,

            useTriesBtn: (n) => `❤️ +3 Versuche (${n})`, useTimeBtn: (n) => `⏱️ +15 Sek. (${n})`

    function addXPAndCoins(mult) {
        const capXP = getMaxRewardPerWin(player.xpUpgradeLvl);
        const capCoins = getMaxRewardPerWin(player.coinUpgradeLvl);
        const gainedXP = Math.min(500, Math.round((capXP * 0.6) + (capXP * 0.4 * (mult / 2.5))));
        const gainedCoins = Math.min(500, Math.round((capCoins * 0.6) + (capCoins * 0.4 * (mult / 2.5))));
        player.coins += gainedCoins;

        if (player.prestige < 100 && player.level >= 100) {
            player.xp = 500;
        } else {
            player.xp += gainedXP;
            while (player.xp >= 500) {
                if (player.prestige < 100 && player.level >= 100) { player.xp = 500; break; }
                player.xp -= 500; player.level++;
                AudioEngine.playTone(660, 0.25, 'triangle', 0.12);
            }
        }
        checkAchievements(); saveLocalData();
        return { gainedXP, gainedCoins };
    }

        if (state.mode === 'sabotage') { player.stats.winsSabotage++; mult = 2.4; } else if (state.mode === 'unique_logic') { player.stats.winsUniqueLogic++; mult = 2.6; }
        else if (state.mode === '1p') { if (state.botDifficulty === 'beginner') { player.stats.winsBeginner++; mult = 1.1; } if (state.botDifficulty === 'easy') { player.stats.winsEasy++; mult = 1.3; } if (state.botDifficulty === 'medium') { player.stats.winsMedium++; mult = 1.6; } if (state.botDifficulty === 'hard') { player.stats.winsHard++; mult = 2.0; } if (state.botDifficulty === 'extreme') { player.stats.winsExtreme++; mult = 2.5; } }
        else if (state.mode === 'temp_only') { player.stats.winsTempOnly++; mult = 2.2; } else if (state.mode === 'deduction') { player.stats.winsDeduction++; mult = 2.5; } else if (state.mode === 'moving') { player.stats.winsMoving++; mult = 2.3; } else { mult = 1.8; }
        const reward = addXPAndCoins(mult); AudioEngine.playTone(784, 0.35, 'triangle', 0.14);
        const capNote = (player.prestige < 100 && player.level >= 100) ? tr.winCapNote : "";
        endGame(true, tr.winSummary(state.secretTarget, state.attempts, reward.gainedXP, reward.gainedCoins, capNote));
    }

    function updateTemperature(guess) {
        const tr = t(), ratio = Math.abs(state.secretTarget - guess) / (state.max - state.min), el = document.getElementById('temp-indicator');
        let text = tr.tempCold, bg = "rgba(30, 58, 138, 0.55)";
        if (ratio <= 0.03) { text = tr.tempBurning; bg = "rgba(239, 68, 68, 0.45)"; } else if (ratio <= 0.08) { text = tr.tempVeryHot; bg = "rgba(249, 115, 22, 0.4)"; } else if (ratio <= 0.18) { text = tr.tempWarm; bg = "rgba(234, 179, 8, 0.35)"; } else if (ratio <= 0.35) { text = tr.tempCool; bg = "rgba(56, 189, 248, 0.3)"; }
        el.innerText = text; el.style.background = bg; return text;
    }

    function runBotTurn() {
        const tr = t(), list = document.getElementById('bot-history-list');
        if (state.botFrozenTurns > 0) { state.botFrozenTurns--; if (list) list.innerHTML = `<div style="color:#7dd3fc;">${tr.botFrozen(state.botFrozenTurns)}</div>` + list.innerHTML; return; }
        state.botAttempts++; const span = state.botMax - state.botMin; let botGuess = Math.floor((state.botMin + state.botMax) / 2);
        if (state.botDifficulty === 'beginner') botGuess = Math.floor(Math.random() * (state.max - state.min + 1)) + state.min;
        else if (state.botDifficulty === 'easy') botGuess = Math.floor(Math.random() * (span + 1)) + state.botMin;
        else if (state.botDifficulty === 'medium') botGuess = Math.max(state.botMin, Math.min(state.botMax, botGuess + Math.floor((Math.random() - 0.5) * span * 0.5)));
        else if (state.botDifficulty === 'extreme') { botGuess = Math.round((botGuess + state.playerSecret) / 2); if (botGuess === state.playerSecret && span > 2) botGuess += (botGuess < state.botMax ? 1 : -1); }
        let hintDir = "🎯";
        if (botGuess < state.playerSecret) { hintDir = tr.dirLow; if (state.botDifficulty !== 'beginner') state.botMin = Math.max(state.botMin, botGuess + 1); }
        else if (botGuess > state.playerSecret) { hintDir = tr.dirHigh; if (state.botDifficulty !== 'beginner') state.botMax = Math.min(state.botMax, botGuess - 1); }
        if (list) list.innerHTML = `<div>${tr.botGuessEntry(state.botAttempts, botGuess, hintDir)}</div>` + list.innerHTML;
        if (botGuess === state.playerSecret) return endGame(false, tr.botWon(state.botDifficulty, state.playerSecret));
    }

    function useHint(type) {
        if (state.gameOver) return;
        const tr = t(); AudioEngine.playTone(600, 0.07); const num = state.secretTarget, log = document.getElementById('hint-log'); log.classList.remove('hidden'); let msg = "";
        if (type === 'parity') { msg = `• ${num % 2 === 0 ? tr.resEven : tr.resOdd}`; if (state.mode !== 'moving') document.getElementById('btn-hint-parity').disabled = true; }
        if (type === 'prime') { msg = `• ${isPrime(num) ? tr.resPrime : tr.resNotPrime}`; if (state.mode !== 'moving') document.getElementById('btn-hint-prime').disabled = true; }
        if (type === 'digitsum') { msg = `• ${tr.resDigitSum}: ${Math.abs(num).toString().split('').reduce((a, b) => a + parseInt(b, 10), 0)}`; if (state.mode !== 'moving') document.getElementById('btn-hint-digitsum').disabled = true; }
        if (type === 'div3') { msg = `• ${num % 3 === 0 ? tr.resDiv3Yes : tr.resDiv3No}`; if (state.mode !== 'moving') document.getElementById('btn-hint-div3').disabled = true; }
        const d = document.createElement('div'); d.innerText = msg; log.appendChild(d);
    }
    function isPrime(n) { if (n <= 1) return false; if (n <= 3) return true; if (n % 2 === 0 || n % 3 === 0) return false; for (let i = 5; i * i <= n; i += 6) if (n % i === 0 || n % (i + 2) === 0) return false; return true; }
    function endGame(won, message) { const tr = t(); state.gameOver = true; AudioEngine.stopGameMusic(); if (state.timerId) clearInterval(state.timerId); document.getElementById('game-screen').classList.add('hidden'); document.getElementById('result-screen').classList.remove('hidden'); document.getElementById('result-title').innerText = won ? tr.winTitle : tr.loseTitle; document.getElementById('result-details').innerText = message; }
    function resetToMenu() { AudioEngine.stopGameMusic(); if (state.timerId) clearInterval(state.timerId); document.getElementById('result-screen').classList.add('hidden'); document.getElementById('game-screen').classList.add('hidden'); document.getElementById('secret-setup-screen').classList.add('hidden'); document.getElementById('setup-screen').classList.remove('hidden'); document.getElementById('main-nav').classList.remove('hidden'); toggleSetupOptions(); }

    loadLocalData();
    document.getElementById('opt-music').checked = player.settings.music;
    document.getElementById('opt-sfx').checked = player.settings.sfx;
    document.getElementById('opt-lang').value = player.settings.lang;
    /* --- MAXIMAL 5 ZEICHEN FÜR DIE ICON-ZAHL --- */
    const iconInputEl = document.getElementById('opt-icon-num');
    if (iconInputEl) {
        iconInputEl.setAttribute('maxlength', '7');
    }

    changeIconNumberFromSettings = function() {
        const val = document.getElementById('opt-icon-num').value.trim();
        player.customIconNumber = val === "" ? "69?" : val.slice(0,7);
        saveLocalData();
    };
    /* --- DYNAMISCHES APP-ICON MIT KOSMETIK FÜR BROWSER & WEB-APP --- */
    function syncDynamicAppFavicon() {
        const c = document.createElement('canvas');
        c.width = 256;
        c.height = 256;
        const ctxIcon = c.getContext('2d');

        // 1. Hintergrundfarbe je nach gewähltem Skin
        let c1 = "#f8fafc", c2 = "#cbd5e1", border = "#38bdf8", eye = "#38bdf8";
        if (player.activeIcon === 'icon-default') { c1 = "#3b82f6"; c2 = "#8b5cf6"; border = "#ec4899"; eye = "#f472b6"; }
        else if (player.activeIcon === 'icon-cyber') { c1 = "#059669"; c2 = "#064e3b"; border = "#34d399"; eye = "#34d399"; }
        else if (player.activeIcon === 'icon-gold') { c1 = "#d97706"; c2 = "#b45309"; border = "#fef08a"; eye = "#fde047"; }
        else if (player.activeIcon === 'icon-inferno') { c1 = "#dc2626"; c2 = "#7f1d1d"; border = "#fca5a5"; eye = "#fb923c"; }
        else if (player.activeIcon === 'icon-void') { c1 = "#1e1b4b"; c2 = "#090d16"; border = "#c084fc"; eye = "#e879f9"; }
        else if (player.activeIcon && player.activeIcon.startsWith('icon-gen-')) {
            const idx = parseInt(player.activeIcon.replace('icon-gen-', ''), 10) || 0;
            const h1 = (idx * 37) % 360;
            const h2 = (h1 + 55) % 360;
            c1 = `hsl(${h1}, 85%, 52%)`;
            c2 = `hsl(${h2}, 85%, 38%)`;
            border = "#ffffff";
            eye = "#ffffff";
        }

        const grad = ctxIcon.createLinearGradient(0, 0, 256, 256);
        grad.addColorStop(0, c1);
        grad.addColorStop(1, c2);

        // 2. App-Kachel zeichnen
        ctxIcon.fillStyle = grad;
        ctxIcon.beginPath();
        ctxIcon.roundRect(18, 28, 220, 210, 48);
        ctxIcon.fill();
        ctxIcon.lineWidth = 10;
        ctxIcon.strokeStyle = border;
        ctxIcon.stroke();

        // 3. Astro-Bot Visier & Leuchtaugen
        ctxIcon.fillStyle = "#0f172a";
        ctxIcon.beginPath();
        ctxIcon.roundRect(52, 92, 152, 74, 24);
        ctxIcon.fill();
        ctxIcon.lineWidth = 5;
        ctxIcon.strokeStyle = border;
        ctxIcon.stroke();

        ctxIcon.fillStyle = eye;
        ctxIcon.beginPath(); ctxIcon.arc(98, 129, 15, 0, Math.PI * 2); ctxIcon.fill();
        ctxIcon.beginPath(); ctxIcon.arc(158, 129, 15, 0, Math.PI * 2); ctxIcon.fill();

        // 4. Kosmetik: Brille, Hut, Rosette & Wunschzahl
        ctxIcon.textAlign = "center";
        ctxIcon.textBaseline = "middle";

        if (player.activeGlasses) {
            ctxIcon.font = "68px sans-serif";
            ctxIcon.fillText(player.activeGlasses, 128, 134);
        }
        if (player.activeHat) {
            ctxIcon.font = "74px sans-serif";
            ctxIcon.fillText(player.activeHat, 128, 44);
        }
        const rosIdx = Math.min(ROSETTES.length - 1, Math.ceil(player.prestige / 10));
        if (player.prestige > 0 && ROSETTES[rosIdx]) {
            ctxIcon.font = "54px sans-serif";
            ctxIcon.fillText(ROSETTES[rosIdx], 212, 212);
        }

        // Gedankenblase mit Wunschzahl
        ctxIcon.fillStyle = "#3b82f6";
        ctxIcon.beginPath();
        ctxIcon.roundRect(138, 12, 108, 46, 16);
        ctxIcon.fill();
        ctxIcon.fillStyle = "#ffffff";
        ctxIcon.font = "bold 24px sans-serif";
        ctxIcon.fillText(player.customIconNumber || "42?", 192, 36);

        // 5. Als Browser-Favicon & Apple-Touch-Icon setzen
        const dataUrl = c.toDataURL("image/png");
        let linkIcon = document.querySelector("link[rel='icon']");
        if (!linkIcon) {
            linkIcon = document.createElement("link");
            linkIcon.rel = "icon";
            document.head.appendChild(linkIcon);
        }
        linkIcon.type = "image/png";
        linkIcon.href = dataUrl;

        let appleIcon = document.querySelector("link[rel='apple-touch-icon']");
        if (!appleIcon) {
            appleIcon = document.createElement("link");
            appleIcon.rel = "apple-touch-icon";
            document.head.appendChild(appleIcon);
        }
        appleIcon.href = dataUrl;
    }

    const prevUpdateProfileUI = updateProfileUI;
    updateProfileUI = function() {
        prevUpdateProfileUI();
        syncDynamicAppFavicon();
    };

    /* --- ALL-IN-ONE APP-INSTALLER (NUR MIT DER INDEX.HTML) --- */
    (function setupSingleFileApp() {
        // 1. Astro-Bot App-Icon (512x512) direkt per Code zeichnen
        const c = document.createElement('canvas');
        c.width = 512; c.height = 512;
        const g = c.getContext('2d');
        const bg = g.createLinearGradient(0, 0, 512, 512);
        bg.addColorStop(0, '#f8fafc'); bg.addColorStop(1, '#cbd5e1');
        g.fillStyle = bg; g.fillRect(0, 0, 512, 512);
        g.fillStyle = '#0f172a'; g.beginPath(); g.roundRect(96, 175, 320, 165, 48); g.fill();
        g.lineWidth = 12; g.strokeStyle = '#38bdf8'; g.stroke();
        g.fillStyle = '#38bdf8';
        g.beginPath(); g.arc(192, 257, 30, 0, Math.PI * 2); g.fill();
        g.beginPath(); g.arc(320, 257, 30, 0, Math.PI * 2); g.fill();
        g.fillStyle = '#3b82f6'; g.beginPath(); g.roundRect(275, 32, 205, 95, 32); g.fill();
        g.fillStyle = '#ffffff'; g.font = 'bold 48px sans-serif'; g.textAlign = 'center';
        g.fillText('42?', 377, 96);
        const iconUrl = c.toDataURL('image/png');

        // 2. Apple-Touch-Icon für iPhone & iPad setzen
        let appleLink = document.querySelector("link[rel='apple-touch-icon']");
        if (!appleLink) {
            appleLink = document.createElement('link');
            appleLink.rel = 'apple-touch-icon';
            document.head.appendChild(appleLink);
        }
        appleLink.href = iconUrl;

        // 3. App-Manifest direkt im Speicher erzeugen (für Android & PC)
        const manifestObj = {
            name: "Numora – Ultimate Edition",
            short_name: "Numora",
            start_url: window.location.href,
            display: "standalone",
            background_color: "#050811",
            theme_color: "#050811",
            icons: [{ src: iconUrl, sizes: "512x512", type: "image/png" }]
        };
        const manifestBlob = new Blob([JSON.stringify(manifestObj)], { type: 'application/json' });
        const manifestLink = document.createElement('link');
        manifestLink.rel = 'manifest';
        manifestLink.href = URL.createObjectURL(manifestBlob);
        document.head.appendChild(manifestLink);

        // 4. Download-Banner für Android & iOS anzeigen
        let deferredPrompt = null;
        window.addEventListener('beforeinstallprompt', (e) => {
            e.preventDefault();
            deferredPrompt = e;
            showAppBanner(true);
        });

        function showAppBanner(hasNativePrompt) {
            if (window.matchMedia('(display-mode: standalone)').matches || window.navigator.standalone) return;
            if (document.getElementById('single-pwa-banner')) return;

            const banner = document.createElement('div');
            banner.id = 'single-pwa-banner';
            banner.style.cssText = "background:linear-gradient(90deg,#1e3a8a,#4c1d95); border:1px solid #60a5fa; border-radius:12px; padding:10px 12px; margin-bottom:12px; display:flex; justify-content:space-between; align-items:center; gap:8px; font-size:0.82rem;";

            if (hasNativePrompt) {
                banner.innerHTML = `<span>📲 <strong>Numora als App herunterladen</strong></span><button id="btn-dl-single" style="width:auto; margin:0; padding:6px 12px; font-size:0.8rem;">Download</button>`;
                document.querySelector('.container').prepend(banner);
                document.getElementById('btn-dl-single').onclick = async () => {
                    if (!deferredPrompt) return;
                    deferredPrompt.prompt();
                    await deferredPrompt.userChoice;
                    deferredPrompt = null;
                    banner.remove();
                };
            } else if (/iPad|iPhone|iPod/.test(navigator.userAgent)) {
                banner.innerHTML = `<span>📲 <strong>App installieren:</strong> Tippe unten auf <strong>Teilen ⬆️</strong> → <strong>„Zum Home-Bildschirm“</strong>.</span><button onclick="this.parentElement.remove()" style="width:auto; margin:0; padding:4px 8px; background:rgba(255,255,255,0.2);">✕</button>`;
                document.querySelector('.container').prepend(banner);
            }
        }
        setTimeout(() => showAppBanner(false), 1500);
    })();

    changeLanguage();
</script>
